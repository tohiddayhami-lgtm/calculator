<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Tohid Dayhami Export⁺</title>
    <!-- Early DNS/connection hints for Firebase services -->
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link rel="preconnect" href="https://firebasestorage.googleapis.com">
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">
    <script>
      (function () {
        var sp = new URLSearchParams(window.location.search);
        if (sp.has('form') || sp.has('c') || sp.has('mh')) return;
        var script = document.createElement('script');
        script.src = 'https://cdn.tailwindcss.com';
        document.head.appendChild(script);
      })();
    </script>
    <script>
      window.__firebase_config = JSON.stringify({
        apiKey: "%VITE_FIREBASE_API_KEY%",
        authDomain: "%VITE_FIREBASE_AUTH_DOMAIN%",
        projectId: "%VITE_FIREBASE_PROJECT_ID%",
        storageBucket: "%VITE_FIREBASE_STORAGE_BUCKET%",
        messagingSenderId: "%VITE_FIREBASE_MESSAGING_SENDER_ID%",
        appId: "%VITE_FIREBASE_APP_ID%",
        measurementId: "%VITE_FIREBASE_MEASUREMENT_ID%"
      });
      window.__app_id = "%VITE_APP_ID%";
      window.__initial_auth_token = "";
    </script>
    <!-- Fast catalog loader: bypasses React bundle for ?c= / ?mh= public links -->
    <!-- Also shows minimal loading overlay for ?form= / ?iso= while React bundle loads -->
    <script>
      (function () {
        var sp = new URLSearchParams(window.location.search);
        var c = sp.get('c');
        var mh = sp.get('mh');
        var form = sp.get('form');
        var iso = sp.get('iso');
        var isCatalogLink = !!(
          (c && /^[A-Za-z0-9]{8,14}$/.test(c)) ||
          (mh && /^[A-Za-z0-9]{8,14}$/.test(mh))
        );
        var isPublicDoc = !!(
          (form && form.length >= 8) ||
          (iso && iso.length >= 8)
        );
        if (!isCatalogLink && !isPublicDoc) return;

        // Shared spinner style
        var spinStyle = document.createElement('style');
        spinStyle.textContent = '@keyframes __cl_spin{to{transform:rotate(360deg)}}';
        document.head.appendChild(spinStyle);

        function makeOverlay(label) {
          var el = document.createElement('div');
          el.id = '__cat_overlay';
          el.style.cssText = 'position:fixed;inset:0;background:#f8fafc;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:99999';
          el.innerHTML = '<div style="width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#10b981;border-radius:50%;animation:__cl_spin 0.8s linear infinite"></div>'
            + '<p style="margin:0;font-family:system-ui,-apple-system,sans-serif;font-size:14px;color:#64748b">' + label + '</p>';
          return el;
        }

        function mountEl(el) {
          if (document.body) { document.body.appendChild(el); }
          else { document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(el); }); }
        }

        // --- ?form= / ?iso= : show overlay + pre-fetch form data before React mounts ---
        if (isPublicDoc) {
          var docOverlay = makeOverlay('Loading…');
          mountEl(docOverlay);
          window.__removeCatalogOverlay = function () {
            var o = document.getElementById('__cat_overlay');
            if (o) o.remove();
          };

          // Pre-fetch ?form= data via REST API so React can use it immediately on mount
          // (saves a full SDK round-trip that would otherwise only start after bundle parses)
          if (form) {
            try {
              var cfg2 = JSON.parse(window.__firebase_config || '{}');
              var pid2 = cfg2.projectId;
              var apiKey2 = cfg2.apiKey;
              if (pid2 && pid2.indexOf('%VITE_') === -1 && apiKey2 && apiKey2.indexOf('%VITE_') === -1) {
                var baseUrl2 = 'https://firestore.googleapis.com/v1/projects/' + encodeURIComponent(pid2) + '/databases/(default)/documents/';
                var auth2 = '?key=' + encodeURIComponent(apiKey2);

                function fsVal(v) {
                  if (v == null || typeof v !== 'object') return v;
                  if ('stringValue' in v) return v.stringValue;
                  if ('integerValue' in v) return parseInt(v.integerValue, 10);
                  if ('doubleValue' in v) return v.doubleValue;
                  if ('booleanValue' in v) return v.booleanValue;
                  if ('nullValue' in v) return null;
                  if ('arrayValue' in v) return (v.arrayValue.values || []).map(fsVal);
                  if ('mapValue' in v) {
                    var r = {};
                    Object.keys(v.mapValue.fields || {}).forEach(function (f) { r[f] = fsVal(v.mapValue.fields[f]); });
                    return r;
                  }
                  if ('timestampValue' in v) return v.timestampValue;
                  return v;
                }
                function fsDoc(d) {
                  if (!d || !d.fields) return null;
                  var r = {};
                  Object.keys(d.fields).forEach(function (f) { r[f] = fsVal(d.fields[f]); });
                  return r;
                }

                var fk2 = form;
                var p1 = fetch(baseUrl2 + 'publicForms/' + encodeURIComponent(fk2) + auth2)
                  .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
                var p2 = fetch(baseUrl2 + 'publicFormAssets/' + encodeURIComponent(fk2) + auth2)
                  .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });

                window.__prefetchedPublicForm = {
                  key: fk2,
                  promise: Promise.all([p1, p2]).then(function (res) {
                    var formDoc = res[0] && fsDoc(res[0]);
                    var assetsDoc = res[1] && fsDoc(res[1]);
                    return { key: fk2, form: formDoc, assets: assetsDoc };
                  })
                };
              }
            } catch (e2) { /* prefetch failed, React falls back to SDK */ }
          }
          return;
        }

        // --- ?c= / ?mh= : fetch Firestore then load iframe ---
        var key = (c && /^[A-Za-z0-9]{8,14}$/.test(c)) ? c : mh;
        var coll = c ? 'catalog_short_links' : 'meta_hub_links';
        window.__isCatalogPublicView = true;

        var overlay = makeOverlay('Loading…');
        mountEl(overlay);

        function removeOverlay() {
          var o = document.getElementById('__cat_overlay');
          if (o) o.remove();
        }

        try {
          var cfg = JSON.parse(window.__firebase_config || '{}');
          var pid = cfg.projectId;
          var apiKey = cfg.apiKey;
          if (!pid || pid.indexOf('%VITE_') !== -1) { removeOverlay(); return; }
          var firestoreUrl = 'https://firestore.googleapis.com/v1/projects/' + pid
            + '/databases/(default)/documents/' + coll + '/' + encodeURIComponent(key)
            + (apiKey && apiKey.indexOf('%VITE_') === -1 ? '?key=' + encodeURIComponent(apiKey) : '');

          fetch(firestoreUrl)
            .then(function (r) {
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.json();
            })
            .then(function (data) {
              var fields = data && data.fields;
              var storageUrl = fields && fields.url && fields.url.stringValue;
              if (!storageUrl || !/^https?:\/\//i.test(storageUrl)) throw new Error('Invalid URL');
              var titleVal = (fields.catalogTitle || fields.title || {}).stringValue || 'Catalog';
              // Hide React root — iframe takes over full screen
              var root = document.getElementById('root');
              if (root) root.style.display = 'none';
              var iframe = document.createElement('iframe');
              iframe.title = titleVal;
              iframe.src = storageUrl;
              iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-popups allow-same-origin allow-downloads');
              iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
              iframe.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:none;background:white;z-index:99998;opacity:0;transition:opacity 0.2s';
              if (document.body) document.body.appendChild(iframe);
              // Remove overlay only after iframe content has loaded, not just after it's appended
              var safetyTimer = setTimeout(removeOverlay, 20000);
              iframe.onload = function () {
                clearTimeout(safetyTimer);
                iframe.style.opacity = '1';
                removeOverlay();
              };
              iframe.onerror = function () {
                clearTimeout(safetyTimer);
                removeOverlay();
              };
            })
            .catch(function () {
              // Fall back to React-based viewer
              removeOverlay();
              var root = document.getElementById('root');
              if (root) root.style.display = '';
              window.__isCatalogPublicView = false;
            });
        } catch (e) {
          removeOverlay();
          window.__isCatalogPublicView = false;
        }
      })();
    </script>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
    <script>
      (function () {
        var sp = new URLSearchParams(window.location.search);
        if (sp.has('form') || sp.has('c') || sp.has('mh')) return;
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap';
        document.head.appendChild(link);
      })();
    </script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
