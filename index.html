<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Tohid Dayhami Export⁺</title>
    <!-- Early DNS/connection hints for Firebase services -->
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link rel="preconnect" href="https://firebasestorage.googleapis.com">
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">
    <script>
      (function () {
        var sp = new URLSearchParams(window.location.search);
        if (sp.has('form') || sp.has('c') || sp.has('mh')) return;
        var script = document.createElement('script');
        script.src = 'https://cdn.tailwindcss.com';
        document.head.appendChild(script);
      })();
    </script>
    <script>
      window.__firebase_config = JSON.stringify({
        apiKey: "%VITE_FIREBASE_API_KEY%",
        authDomain: "%VITE_FIREBASE_AUTH_DOMAIN%",
        projectId: "%VITE_FIREBASE_PROJECT_ID%",
        storageBucket: "%VITE_FIREBASE_STORAGE_BUCKET%",
        messagingSenderId: "%VITE_FIREBASE_MESSAGING_SENDER_ID%",
        appId: "%VITE_FIREBASE_APP_ID%",
        measurementId: "%VITE_FIREBASE_MEASUREMENT_ID%"
      });
      window.__app_id = "%VITE_APP_ID%";
      window.__initial_auth_token = "";
    </script>
    <!-- Fast catalog loader: bypasses React bundle for ?c= / ?mh= public links -->
    <script>
      (function () {
        var sp = new URLSearchParams(window.location.search);
        var c = sp.get('c');
        var mh = sp.get('mh');
        var key = (c && /^[A-Za-z0-9]{8,14}$/.test(c)) ? c
                : (mh && /^[A-Za-z0-9]{8,14}$/.test(mh)) ? mh
                : null;
        if (!key) return;
        var coll = c ? 'catalog_short_links' : 'meta_hub_links';
        window.__isCatalogPublicView = true;

        // Show spinner immediately — before any JS bundle loads
        var spinStyle = document.createElement('style');
        spinStyle.textContent = '@keyframes __cl_spin{to{transform:rotate(360deg)}}';
        document.head.appendChild(spinStyle);
        var overlay = document.createElement('div');
        overlay.id = '__cat_overlay';
        overlay.style.cssText = 'position:fixed;inset:0;background:#f8fafc;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:99999';
        overlay.innerHTML = '<div style="width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#10b981;border-radius:50%;animation:__cl_spin 0.8s linear infinite"></div>'
          + '<p style="margin:0;font-family:system-ui,-apple-system,sans-serif;font-size:14px;color:#64748b">Loading catalog…</p>';

        // Wait for body to be available
        function mountOverlay() {
          if (document.body) { document.body.appendChild(overlay); }
          else { document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(overlay); }); }
        }
        mountOverlay();

        try {
          var cfg = JSON.parse(window.__firebase_config || '{}');
          var pid = cfg.projectId;
          var apiKey = cfg.apiKey;
          if (!pid || pid.indexOf('%VITE_') !== -1) { overlay.remove(); return; }
          var firestoreUrl = 'https://firestore.googleapis.com/v1/projects/' + pid
            + '/databases/(default)/documents/' + coll + '/' + encodeURIComponent(key)
            + (apiKey && apiKey.indexOf('%VITE_') === -1 ? '?key=' + encodeURIComponent(apiKey) : '');

          fetch(firestoreUrl)
            .then(function (r) {
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.json();
            })
            .then(function (data) {
              var fields = data && data.fields;
              var storageUrl = fields && fields.url && fields.url.stringValue;
              if (!storageUrl || !/^https?:\/\//i.test(storageUrl)) throw new Error('Invalid URL');
              var titleVal = (fields.catalogTitle || fields.title || {}).stringValue || 'Catalog';
              // Hide React root — iframe takes over full screen
              var root = document.getElementById('root');
              if (root) root.style.display = 'none';
              var iframe = document.createElement('iframe');
              iframe.title = titleVal;
              iframe.src = storageUrl;
              iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-popups allow-same-origin allow-downloads');
              iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
              iframe.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:none;background:white;z-index:99998';
              if (document.body) document.body.appendChild(iframe);
              overlay.remove();
            })
            .catch(function () {
              // Fall back to React-based viewer
              overlay.remove();
              var root = document.getElementById('root');
              if (root) root.style.display = '';
              window.__isCatalogPublicView = false;
            });
        } catch (e) {
          overlay.remove();
          window.__isCatalogPublicView = false;
        }
      })();
    </script>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
    <script>
      (function () {
        var sp = new URLSearchParams(window.location.search);
        if (sp.has('form') || sp.has('c') || sp.has('mh')) return;
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap';
        document.head.appendChild(link);
      })();
    </script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
